  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <circle cx="180" cy="150" r="180" fill="#7c5cfc" opacity="0.25" filter="url(#blur1)"/>
  <circle cx="1050" cy="480" r="220" fill="#38d2ff" opacity="0.22" filter="url(#blur1)"/>
  <circle cx="950" cy="120" r="140" fill="#e040fb" opacity="0.18" filter="url(#blur1)"/>

  <g opacity="0.35" fill="#ffffff">
    <rect x="60" y="470" width="50" height="120"/>
    <rect x="120" y="430" width="40" height="160"/>
    <rect x="170" y="490" width="55" height="100"/>
    <rect x="235" y="410" width="45" height="180"/>
    <rect x="290" y="460" width="35" height="130"/>
    <rect x="335" y="440" width="50" height="150"/>
    <polygon points="360,440 385,440 372,410"/>
